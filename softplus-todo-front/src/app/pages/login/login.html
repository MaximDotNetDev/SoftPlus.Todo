<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">

    <div class="text-center">
      <h2 class="text-3xl font-bold text-blue-600">To-Do</h2>
      <p class="text-slate-500 mt-2">Раді бачити вас знову</p>
    </div>

    @if (successMessage) {
    <div class="p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm text-center font-medium shadow-sm transition-all">
      {{ successMessage }}
    </div>
    }

    @if (errorMessage) {
    <div class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center font-medium">
      {{ errorMessage }}
    </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email"
               formControlName="email"
               placeholder="name@example.com"
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
        <input type="password"
               formControlName="password"
               placeholder="••••••••"
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <button type="submit"
              [disabled]="loginForm.invalid || isLoading"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md flex justify-center items-center cursor-pointer disabled:cursor-not-allowed">
        @if (isLoading) {
        <span>Завантаження...</span>
        } @else {
        <span>Увійти</span>
        }
      </button>

    </form>

    <p class="text-center text-sm text-slate-600">
      Ще немає акаунту?
      <a routerLink="/register" class="text-blue-600 hover:underline font-medium">Зареєструватися</a>
    </p>

  </div>
</div>
